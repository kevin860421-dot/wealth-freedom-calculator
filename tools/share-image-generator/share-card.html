<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share Card (template)</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        display: grid;
        place-items: center;
      }
      canvas {
        width: 1080px;
        height: 1080px;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1080" height="1080"></canvas>
    <script>
      const q = new URLSearchParams(location.search);
      const yearsRaw = Number(q.get("years") || "10");
      const years = Math.max(0, Math.ceil(isFinite(yearsRaw) ? yearsRaw : 10));
      const link = (q.get("link") || "https://wealth-freedom-calculator.vercel.app/").trim();
      const title = (q.get("title") || "我的退休時間縮短了").trim();
      const site = (q.get("site") || "財富自由計算機").trim();

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: false });

      function coverDrawImage(img) {
        const cw = canvas.width, ch = canvas.height;
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        const scale = Math.max(cw / iw, ch / ih);
        const sw = cw / scale;
        const sh = ch / scale;
        const sx = (iw - sw) / 2;
        const sy = (ih - sh) / 2;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      }

      function roundRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function draw(bgImg, qrImg) {
        // background (cover crop)
        ctx.fillStyle = "#0b1020";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        coverDrawImage(bgImg);

        // contrast veil
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // headline
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = '900 68px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillStyle = "rgba(8, 32, 22, 0.96)";
        ctx.shadowColor = "rgba(0,0,0,0.18)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(title, 540, 92);
        ctx.restore();

        // circle + number
        const cx = 540, cy = 380, r = 170;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = "rgba(16, 120, 90, 0.18)";
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#135a46";
        ctx.font = '900 160px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillText(String(years), cx, cy - 12);
        ctx.font = '900 56px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillText("年", cx + 150, cy + 42);
        ctx.restore();

        // bottom info card
        const cardX = 64, cardY = 740, cardW = 1080 - 128, cardH = 256;
        ctx.save();
        roundRect(cardX, cardY, cardW, cardH, 28);
        ctx.fillStyle = "rgba(255,255,255,0.78)";
        ctx.fill();
        ctx.strokeStyle = "rgba(16,120,90,0.12)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = "rgba(15, 60, 46, 0.92)";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = '800 36px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillText(site, cardX + 28, cardY + 24);
        ctx.font = '600 30px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillStyle = "rgba(15, 60, 46, 0.78)";
        ctx.fillText("掃碼打開網頁", cardX + 28, cardY + 84);
        ctx.fillStyle = "rgba(15, 60, 46, 0.72)";
        ctx.font = '600 24px ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
        ctx.fillText("用同一組假設，自己拉一次看看。", cardX + 28, cardY + 132);
        ctx.restore();

        // QR code (right side)
        if (qrImg) {
          const qrSize = 190;
          const qrPad = 18;
          const qx = cardX + cardW - qrPad - qrSize;
          const qy = cardY + (cardH - qrSize) / 2;
          ctx.save();
          roundRect(qx - 10, qy - 10, qrSize + 20, qrSize + 20, 18);
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.fill();
          ctx.strokeStyle = "rgba(16,120,90,0.10)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.drawImage(qrImg, qx, qy, qrSize, qrSize);
          ctx.restore();
        }
      }

      (async () => {
        const img = new Image();
        img.src = "assets/share_bg.png";
        await new Promise((res, rej) => {
          img.onload = () => res();
          img.onerror = rej;
        });
        let qrImg = null;
        try {
          const qrDataUrl = await window.QRCode.toDataURL(link, {
            errorCorrectionLevel: "M",
            margin: 1,
            width: 240,
            color: { dark: "#0a3b2a", light: "#ffffff" },
          });
          qrImg = new Image();
          qrImg.src = qrDataUrl;
          await new Promise((res, rej) => {
            qrImg.onload = () => res();
            qrImg.onerror = rej;
          });
        } catch (e) {
          qrImg = null;
        }
        draw(img, qrImg);
        // signal ready
        window.__CARD_READY__ = true;
      })();
    </script>
  </body>
</html>
